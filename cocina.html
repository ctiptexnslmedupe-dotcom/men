        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3d3830; border-radius: 999px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #d4af37; }

<body class="min-h-screen flex flex-col antialiased selection:bg-luxe-gold selection:text-black relative">

                <circle cx="250" cy="250" r="205" stroke-opacity="0.8"/>
                <path d="M190 200 L210 160 L250 185 L290 160 L310 200 Z" fill="currentColor" fill-opacity="0.15" stroke-width="2"/>
                <path d="M250 195 L205 305 H228 L238 280 H262 L272 305 H295 L250 195Z" fill="currentColor" fill-opacity="0.25"/>

    <!-- 1. PANTALLA DE LOGIN POR PIN -->
    <div id="pantallaLoginCocina" class="fixed inset-0 z-50 bg-luxe-base flex items-center justify-center p-4">
        <div class="bg-luxe-surface w-full max-w-sm rounded-3xl border border-luxe-border p-8 text-center shadow-2xl relative overflow-hidden">

            <input type="password" id="inputPinStaff" maxlength="4" placeholder="••••" class="w-full bg-luxe-card text-center text-2xl tracking-[0.5em] font-black text-luxe-gold py-3 rounded-2xl border border-luxe-border focus:border-luxe-gold focus:outline-none mb-5 shadow-inner">

    <!-- 2. DASHBOARD KDS CON ASISTENTE DE VOZ -->
    <div id="dashboardCocina" class="hidden flex-1 flex flex-col relative z-10">
        
        <!-- HEADER KDS CON CONTROLES DE VOZ -->
        <header class="bg-luxe-surface/90 backdrop-blur-xl border-b border-luxe-border px-6 py-3.5 flex flex-wrap justify-between items-center gap-3 shadow-xl">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-luxe-card border border-luxe-gold/40 flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-fire-burner text-luxe-gold text-sm"></i>
                </div>
                <div>
                    <h1 class="text-xs tracking-[0.25em] font-luxury-serif font-black uppercase text-luxe-stone leading-none">
                        KDS • <span class="text-luxe-gold">Voice & Production</span>
                    </h1>
                    <span class="text-[9px] tracking-widest text-luxe-muted font-semibold uppercase flex items-center gap-1.5 mt-1">

            <!-- CENTRO: CONTROLES DEL ASISTENTE DE VOZ -->

                <!-- Toggle de Voz -->
                <button id="btnToggleVoz" onclick="toggleAsistenteVoz()" class="px-2.5 py-1 bg-luxe-gold/15 text-luxe-gold border border-luxe-gold/40 rounded-xl text-xs font-bold transition flex items-center gap-1.5" title="Activar o silenciar la voz del chef">
                    <i id="iconoVoz" class="fa-solid fa-volume-high"></i>
                    <span id="txtEstadoVoz" class="hidden md:inline">Voz: Activada</span>
                </button>

                <!-- Botón Repetir Última Comanda -->
                <button onclick="repetirUltimaComanda()" class="px-2.5 py-1 bg-luxe-surface hover:bg-luxe-cardHover text-amber-300 border border-amber-500/30 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm" title="Volver a cantar el último pedido">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Repetir Comanda</span>
                </button>

                <!-- Reloj -->
                <div class="hidden lg:flex items-center pl-2 border-l border-luxe-border text-xs font-mono text-luxe-muted">
                    <i class="fa-regular fa-clock mr-1 text-luxe-gold"></i>
                    <span id="relojLive">--:--:--</span>
                </div>
            </div>

            <!-- DERECHA: CERRAR TURNO -->
            <div class="flex items-center space-x-3">
                <button onclick="cerrarSesionStaff()" class="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Cerrar Turno</span>
                </button>
            </div>
        </header>

        <!-- STREAM DE ALERTAS EN VIVO -->
        <div class="bg-luxe-surface/60 border-b border-luxe-border px-6 py-2.5 flex items-center gap-3 overflow-x-auto custom-scroll shadow-sm">
            <span class="text-[10px] font-black uppercase tracking-widest text-amber-300 flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-bell animate-bounce"></i> Alertas de Salón:
            </span>
            <div id="contenedorAlertasStaff" class="flex items-center gap-2 flex-wrap"></div>
        </div>

        <!-- TABLERO KANBAN KDS -->
        <main class="flex-1 max-w-7xl mx-auto w-full p-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Columna 1: 🔴 Nuevos -->
                <div class="bg-luxe-surface/90 backdrop-blur-md rounded-3xl p-4 border border-luxe-border flex flex-col shadow-xl">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-luxe-border">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></span>
                            <h3 class="font-black text-xs tracking-wider uppercase text-luxe-stone">1. Nuevos en Comandera</h3>
                        </div>
                        <span id="badgeNuevos" class="px-2 py-0.5 bg-rose-500/10 text-rose-400 font-bold text-xs rounded-lg border border-rose-500/20">0</span>
                    </div>
                    <div id="columnaNuevos" class="space-y-4 flex-1 overflow-y-auto custom-scroll min-h-[500px]"></div>
                </div>

                <!-- Columna 2: 🟡 En Fuego -->
                <div class="bg-luxe-surface/90 backdrop-blur-md rounded-3xl p-4 border border-luxe-border flex flex-col shadow-xl">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-luxe-border">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                            <h3 class="font-black text-xs tracking-wider uppercase text-luxe-stone">2. En Fuego / Cocinando</h3>
                        </div>
                        <span id="badgePrep" class="px-2 py-0.5 bg-amber-500/10 text-amber-400 font-bold text-xs rounded-lg border border-amber-500/20">0</span>
                    </div>
                    <div id="columnaPrep" class="space-y-4 flex-1 overflow-y-auto custom-scroll min-h-[500px]"></div>
                </div>

                <!-- Columna 3: 🟢 Servidos & Control de Caja -->
                <div class="bg-luxe-surface/90 backdrop-blur-md rounded-3xl p-4 border border-luxe-border flex flex-col shadow-xl">
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-luxe-border">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
                            <h3 class="font-black text-xs tracking-wider uppercase text-luxe-stone">3. Servidos & Caja</h3>
                        </div>
                        <span id="badgeEntregados" class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 font-bold text-xs rounded-lg border border-emerald-500/20">0</span>
                    </div>
                    <div id="columnaEntregados" class="space-y-4 flex-1 overflow-y-auto custom-scroll min-h-[500px]"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- CONTENEDOR OCULTO PARA IMPRESIÓN TÉRMICA 80MM -->
    <div id="areaImpresionTermica" class="hidden"></div>

    <!-- JAVASCRIPT DE COCINA CON ASISTENTE DE VOZ -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOdDt5smefZAZHcMZA2spWVRwT8xaAAq4",
            authDomain: "work-9d40e.firebaseapp.com",
            databaseURL: "https://work-9d40e-default-rtdb.firebaseio.com",
            projectId: "work-9d40e",
            storageBucket: "work-9d40e.firebasestorage.app",
            messagingSenderId: "200660411485",
            appId: "1:200660411485:web:cd81eb3611578c8fee19b4"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let primeraCarga = true;
        let dbMesasCache = {};
        let vozActivada = true;
        let ultimaComandaDictadaTexto = "No hay pedidos recientes para repetir.";

        // MOTOR DE SÍNTESIS DE VOZ NATIVO (WEB SPEECH API)
        function hablarTexto(texto, velocidad = 1.05) {
            if (!vozActivada || !('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // Detiene audios previos

            const locucion = new SpeechSynthesisUtterance(texto);
            locucion.lang = 'es-ES'; // Español natural
            locucion.rate = velocidad;
            locucion.pitch = 1.0;
            locucion.volume = 1.0;

            // Buscar voz en español disponible
            const voces = window.speechSynthesis.getVoices();
            const vozEspanol = voces.find(v => v.lang.startsWith('es'));
            if (vozEspanol) {
                locucion.voice = vozEspanol;
            }

            window.speechSynthesis.speak(locucion);
        }

        // CANTAR COMANDA EN FORMATO CHEF CONCISO
        function cantarComandaVoz(mesaId, ronda, items) {
            let textoVoz = `¡Marcha ${mesaId}! `;
            items.forEach(it => {
                const cantidadTxt = it.cantidad === 1 ? 'Un' : `${it.cantidad}`;
                textoVoz += `${cantidadTxt} ${it.nombre}. `;

                if (it.extras && it.extras.length > 0) {
                    const nombresExtras = it.extras.map(e => e.nombre).join(', ');
                    textoVoz += `Con ${nombresExtras}. `;
                }

                if (it.notas && it.notas !== 'Sin notas especiales') {
                    textoVoz += `Nota: ${it.notas}. `;
                }
            });

            ultimaComandaDictadaTexto = textoVoz;
            hablarTexto(textoVoz);
        }

        function cantarAlertaVoz(mensaje) {
            hablarTexto(`¡Atención salón! ${mensaje}`, 1.1);
        }

        function repetirUltimaComanda() {
            reproducirGongCocina();
            setTimeout(() => {
                hablarTexto(ultimaComandaDictadaTexto);
            }, 600);
        }

        function toggleAsistenteVoz() {
            vozActivada = !vozActivada;
            const btn = document.getElementById('btnToggleVoz');
            const icon = document.getElementById('iconoVoz');
            const txt = document.getElementById('txtEstadoVoz');

            if (vozActivada) {
                btn.className = 'px-2.5 py-1 bg-luxe-gold/15 text-luxe-gold border border-luxe-gold/40 rounded-xl text-xs font-bold transition flex items-center gap-1.5';
                icon.className = 'fa-solid fa-volume-high';
                txt.innerText = 'Voz: Activada';
                hablarTexto("Asistente de voz activado");
            } else {
                window.speechSynthesis.cancel();
                btn.className = 'px-2.5 py-1 bg-luxe-surface text-luxe-muted border border-luxe-border rounded-xl text-xs font-bold transition flex items-center gap-1.5';
                icon.className = 'fa-solid fa-volume-xmark';
                txt.innerText = 'Voz: Silenciada';
            }
        }

        // GONG DE ATENCIÓN DE COCINA
        function reproducirGongCocina() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                [440, 554.37, 659.25, 880].forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + (i * 0.04));
                    gain.gain.setValueAtTime(0.12, now + (i * 0.04));
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + (i * 0.04));
                    osc.stop(now + 1.2);
                });
            } catch(e) {}
        }

        function autenticarStaff() {
            const pin = document.getElementById('inputPinStaff').value;
            if (pin === '1234' || pin === '') {
                sessionStorage.setItem('staff_auth', 'true');
                document.getElementById('pantallaLoginCocina').classList.add('hidden');
                document.getElementById('dashboardCocina').classList.remove('hidden');
                iniciarKDS();
                hablarTexto("Sistema de cocina listo");
            } else {
                alert('PIN Incorrecto. Prueba con 1234');
            }
        }

        function cerrarSesionStaff() {
            sessionStorage.removeItem('staff_auth');
            location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('staff_auth') === 'true') {
                document.getElementById('pantallaLoginCocina').classList.add('hidden');
                document.getElementById('dashboardCocina').classList.remove('hidden');
                iniciarKDS();
            }

            setInterval(() => {
                const r = document.getElementById('relojLive');
                if (r) r.innerText = new Date().toLocaleTimeString();
            }, 1000);
        });

        function iniciarKDS() {
            // Cargar voces en memoria
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }

            let totalComandasAnterior = -1;

            db.ref('mesas').on('value', (snapshot) => {
                dbMesasCache = snapshot.val() || {};
                renderizarTableroKDS(dbMesasCache);

                // Detectar si entró una nueva comanda para cantarla por voz
                let totalComandasActuales = 0;
                let ultimaComandaNueva = null;
                let mesaDeComanda = "";

                Object.keys(dbMesasCache).forEach(k => {
                    const m = dbMesasCache[k];
                    if (m && m.comandas) {
                        totalComandasActuales += m.comandas.length;
                        m.comandas.forEach(c => {
                            if (c.estado === 'nuevo') {
                                ultimaComandaNueva = c;
                                mesaDeComanda = m.mesaId;
                            }
                        });
                    }
                });

                if (!primeraCarga && totalComandasActuales > totalComandasAnterior && ultimaComandaNueva) {
                    reproducirGongCocina();
                    setTimeout(() => {
                        cantarComandaVoz(mesaDeComanda, ultimaComandaNueva.ronda, ultimaComandaNueva.items);
                    }, 500);
                }

                totalComandasAnterior = totalComandasActuales;
                primeraCarga = false;
            });

            let totalAlertasAnterior = -1;
            db.ref('alertas').on('value', (snapshot) => {
                const dbAlertas = snapshot.val() || {};
                renderizarAlertasStaff(dbAlertas);

                const keys = Object.keys(dbAlertas);
                if (!primeraCarga && keys.length > totalAlertasAnterior && keys.length > 0) {
                    const ultimaAlerta = dbAlertas[keys[keys.length - 1]];
                    reproducirGongCocina();
                    setTimeout(() => {
                        cantarAlertaVoz(ultimaAlerta.mensaje);
                    }, 400);
                }
                totalAlertasAnterior = keys.length;
            });
        }

        function renderizarTableroKDS(dbMesas) {
            const colNuevos = document.getElementById('columnaNuevos');
            const colPrep = document.getElementById('columnaPrep');
            const colEntregados = document.getElementById('columnaEntregados');

            colNuevos.innerHTML = '';
            colPrep.innerHTML = '';
            colEntregados.innerHTML = '';

            let cN = 0, cP = 0, cE = 0;

            Object.keys(dbMesas).forEach(mKey => {
                const mesa = dbMesas[mKey];

                if (mesa && mesa.comandas) {
                    mesa.comandas.forEach((cmd, cmdIdx) => {
                        const card = document.createElement('div');
                        card.className = 'bg-luxe-card p-4 rounded-2xl border border-luxe-border shadow-md flex flex-col justify-between';

                        let itemsHtml = '';
                        if (cmd.items) {
                            cmd.items.forEach((it, itIdx) => {
                                itemsHtml += `
                                    <div class="py-1.5 border-b border-luxe-border/40 text-xs flex justify-between items-start">
                                        <div class="flex-1 pr-2">
                                            <span class="font-bold text-luxe-stone">${it.cantidad}x ${it.nombre}</span>
                                            ${it.extras && it.extras.length > 0 ? `<p class="text-[10px] text-luxe-gold font-semibold">+ Extras: ${it.extras.map(e => e.nombre).join(', ')}</p>` : ''}
                                            ${it.notas !== 'Sin notas especiales' ? `<p class="text-[10px] text-amber-300 font-semibold bg-luxe-surface px-2 py-0.5 rounded border border-luxe-border mt-0.5">⚠️ Nota: "${it.notas}"</p>` : ''}
                                        </div>
                                        <button onclick="cancelarItemDeComanda('${mKey}', ${cmdIdx}, ${itIdx})" class="text-slate-500 hover:text-rose-400 text-xs p-1" title="Cancelar este plato (Descuenta el saldo)">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                `;
                            });
                        }

                        let actionBtn = '';
                        if (cmd.estado === 'nuevo') {
                            cN++;
                            actionBtn = `<button onclick="cambiarEstadoComanda('${mKey}', ${cmdIdx}, 'preparacion')" class="w-full py-2.5 bg-amber-400 hover:bg-amber-300 text-black font-black text-xs rounded-xl transition shadow">Iniciar Preparación 👨‍🍳</button>`;
                            colNuevos.appendChild(card);
                        } else if (cmd.estado === 'preparacion') {
                            cP++;
                            actionBtn = `<button onclick="cambiarEstadoComanda('${mKey}', ${cmdIdx}, 'entregado')" class="w-full py-2.5 bg-emerald-400 hover:bg-emerald-300 text-black font-black text-xs rounded-xl transition shadow">Marcar como Servido 🚀</button>`;
                            colPrep.appendChild(card);
                        } else {
                            cE++;
                            actionBtn = `<span class="text-[11px] text-center block text-luxe-muted font-bold">✓ Entregado a comensal</span>`;
                            colEntregados.appendChild(card);
                        }

                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start pb-2 mb-2 border-b border-luxe-border">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-xs font-luxury-serif font-black text-luxe-gold bg-luxe-surface px-2.5 py-1 rounded-lg border border-luxe-border">${mesa.mesaId}</span>
                                        <span class="text-[10px] text-luxe-muted font-bold">Ronda #${cmd.ronda}</span>
                                    </div>
                                    <span class="text-[11px] font-mono text-luxe-muted"><i class="fa-regular fa-clock mr-1"></i>${cmd.hora}</span>
                                </div>
                                <div class="space-y-1 mb-3">${itemsHtml}</div>
                            </div>
                            <div class="pt-2 border-t border-luxe-border">${actionBtn}</div>
                        `;
                    });

                    // TARJETA DE CAJA CON IMPRESIÓN 80MM Y LIBERACIÓN
                    if (mesa.comandas && mesa.comandas.length > 0) {
                        const cajaBox = document.createElement('div');
                        cajaBox.className = 'mt-3 bg-luxe-surface p-4 rounded-2xl border border-rose-500/40 shadow-lg space-y-2.5';
                        
                        const totalMesa = mesa.totalAcumulado || 0;
                        const split2 = (totalMesa / 2).toFixed(2);
                        const split4 = (totalMesa / 4).toFixed(2);

                        cajaBox.innerHTML = `
                            <div class="flex justify-between items-center border-b border-luxe-border/50 pb-2">
                                <span class="text-xs font-luxury-serif font-black text-luxe-stone">${mesa.mesaId}</span>
                                <span class="text-sm font-black text-luxe-gold font-luxury-serif">Total: S/ ${totalMesa.toFixed(2)}</span>
                            </div>

                            <div class="text-[10px] text-luxe-muted flex justify-between">
                                <span>División sugerida:</span>
                                <span class="text-amber-300 font-bold">2p: S/ ${split2} | 4p: S/ ${split4}</span>
                            </div>

                            <div class="grid grid-cols-2 gap-2 pt-1">
                                <button onclick="imprimirTicketTermico('${mKey}')" class="py-2 bg-luxe-card hover:bg-luxe-cardHover text-luxe-gold border border-luxe-border text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow">
                                    <i class="fa-solid fa-print"></i>
                                    <span>Imprimir 80mm</span>
                                </button>
                                
                                <button onclick="liberarMesaTotal('${mKey}', '${mesa.mesaId}')" class="py-2 bg-rose-600 hover:bg-rose-500 text-white font-black text-xs rounded-xl shadow transition flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-broom"></i>
                                    <span>Cobrar y Liberar</span>
                                </button>
                            </div>
                        `;
                        colEntregados.appendChild(cajaBox);
                    }
                }
            });

            document.getElementById('badgeNuevos').innerText = cN;
            document.getElementById('badgePrep').innerText = cP;
            document.getElementById('badgeEntregados').innerText = cE;
        }

        function cambiarEstadoComanda(mKey, cmdIdx, nuevoEstado) {
            db.ref(`mesas/${mKey}/comandas/${cmdIdx}/estado`).set(nuevoEstado);
        }

        function cancelarItemDeComanda(mKey, cmdIdx, itIdx) {
            const mesa = dbMesasCache[mKey];
            if (!mesa || !mesa.comandas || !mesa.comandas[cmdIdx] || !mesa.comandas[cmdIdx].items[itIdx]) return;

            const itemCancelado = mesa.comandas[cmdIdx].items[itIdx];
            const conf = confirm(`¿Cancelar "${itemCancelado.cantidad}x ${itemCancelado.nombre}" de la ${mesa.mesaId}?\nSe restará S/ ${itemCancelado.subtotal.toFixed(2)} de la cuenta.`);
            if (!conf) return;

            mesa.totalAcumulado = Math.max(0, (mesa.totalAcumulado || 0) - itemCancelado.subtotal);
            mesa.comandas[cmdIdx].items.splice(itIdx, 1);

            if (mesa.comandas[cmdIdx].items.length === 0) {
                mesa.comandas.splice(cmdIdx, 1);
            }

            if (mesa.comandas.length === 0) {
                db.ref('mesas/' + mKey).remove();
            } else {
                db.ref('mesas/' + mKey).set(mesa);
            }
        }

        // GENERAR E IMPRIMIR TICKET TÉRMICO DE 80MM (WINDOW.PRINT)
        function imprimirTicketTermico(mKey) {
            const mesa = dbMesasCache[mKey];
            if (!mesa) return;

            const area = document.getElementById('areaImpresionTermica');
            const total = mesa.totalAcumulado || 0;
            const subtotalSinIgv = total / 1.18;
            const igv = total - subtotalSinIgv;

            let filasItems = '';
            if (mesa.comandas) {
                mesa.comandas.forEach(cmd => {
                    if (cmd.items) {
                        cmd.items.forEach(it => {
                            let extras = it.extras && it.extras.length > 0 ? `<br>&nbsp;&nbsp;+ ${it.extras.map(e => e.nombre).join(', ')}` : '';
                            let notas = it.notas !== 'Sin notas especiales' ? `<br>&nbsp;&nbsp;* Nota: ${it.notas}` : '';

                            filasItems += `
                                <tr>
                                    <td style="vertical-align: top;">${it.cantidad}</td>
                                    <td style="vertical-align: top; padding-left: 4px;">${it.nombre}${extras}${notas}</td>
                                    <td style="vertical-align: top; text-align: right; white-space: nowrap;">S/ ${it.subtotal.toFixed(2)}</td>
                                </tr>
                            `;
                        });
                    }
                });
            }

            area.innerHTML = `
                <div style="text-align: center; margin-bottom: 8px;">
                    <h2 style="font-size: 14px; font-weight: bold; margin: 0; text-transform: uppercase;">AUREUS RESERVE</h2>
                    <p style="margin: 2px 0; font-size: 10px;">R.U.C. 20601234567 • ALTA GASTRONOMÍA</p>
                    <p style="margin: 2px 0; font-size: 10px;">Av. Gastronomía 123, Miraflores, Lima</p>
                    <p style="margin: 4px 0 0 0; font-size: 11px; font-weight: bold;">TICKET DE CONSUMO: ${mesa.mesaId}</p>
                    <p style="margin: 0; font-size: 10px;">Fecha: ${new Date().toLocaleDateString()} • Hora: ${new Date().toLocaleTimeString()}</p>
                    <div style="border-bottom: 1px dashed #000; margin: 6px 0;"></div>
                </div>

                <table style="width: 100%; border-collapse: collapse; font-size: 10px; line-height: 1.2;">
                    <thead>
                        <tr style="border-bottom: 1px dashed #000;">
                            <th style="text-align: left; width: 20px;">Cant</th>
                            <th style="text-align: left; padding-left: 4px;">Descripción</th>
                            <th style="text-align: right;">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filasItems}
                    </tbody>
                </table>

                <div style="border-top: 1px dashed #000; margin: 6px 0;"></div>

                <table style="width: 100%; font-size: 10px; line-height: 1.3;">
                    <tr>
                        <td>Op. Gravada:</td>
                        <td style="text-align: right;">S/ ${subtotalSinIgv.toFixed(2)}</td>
                    </tr>
                    <tr>
                        <td>I.G.V. (18%):</td>
                        <td style="text-align: right;">S/ ${igv.toFixed(2)}</td>
                    </tr>
                    <tr style="font-size: 13px; font-weight: bold; border-top: 1px solid #000;">
                        <td style="padding-top: 4px;">TOTAL A PAGAR:</td>
                        <td style="text-align: right; padding-top: 4px;">S/ ${total.toFixed(2)}</td>
                    </tr>
                </table>

                <div style="border-top: 1px dashed #000; margin: 6px 0;"></div>

                <div style="font-size: 9px; text-align: center; line-height: 1.2;">
                    <p style="margin: 2px 0;">División sugerida: 2p: S/ ${(total/2).toFixed(2)} | 4p: S/ ${(total/4).toFixed(2)}</p>
                    <p style="margin: 4px 0 0 0; font-weight: bold;">¡GRACIAS POR SU PREFERENCIA!</p>
                    <p style="margin: 2px 0;">Comprobante de consumo interno</p>
                </div>
            `;

            window.print();
        }

        function liberarMesaTotal(mKey, mesaNombre) {
            const conf = confirm(`¿Confirmar cobro y liberar ${mesaNombre}?\nLa pantalla del cliente volverá a S/ 0.00.`);
            if (!conf) return;

            db.ref('mesas/' + mKey).remove().then(() => {
                db.ref('alertas').once('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        Object.keys(data).forEach(k => {
                            if (data[k].mesa === mesaNombre) {
                                db.ref('alertas/' + k).remove();
                            }
                        });
                    }
                });
            });
        }

        function renderizarAlertasStaff(alertasObj) {
            const cont = document.getElementById('contenedorAlertasStaff');
            cont.innerHTML = '';

            const keys = Object.keys(alertasObj);
            if (keys.length === 0) {
                cont.innerHTML = '<span class="text-[10px] text-luxe-muted italic">Sin llamadas pendientes</span>';
                return;
            }

            keys.slice(-4).reverse().forEach(k => {
                const alt = alertasObj[k];
                const tag = document.createElement('div');
                tag.className = 'px-3 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm';
                tag.innerHTML = `
                    <span>${alt.mensaje} (${alt.hora})</span>
                    <button onclick="eliminarAlerta('${k}')" class="text-luxe-muted hover:text-white" title="Marcar atendido"><i class="fa-solid fa-check"></i></button>
                `;
                cont.appendChild(tag);
            });
        }

        function eliminarAlerta(key) {
            db.ref('alertas/' + key).remove();
        }
    </script>
</body>
</html>
